name: Build & Release APK & OTA Bundle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: |
          npm init -y || true
          npm install

      - name: Generate Auto Versioning Tag
        id: version
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Frontend Bundle ZIP (OTA)
        run: |
          # Zip folder www (pastikan folder www berisi file web app lo)
          zip -r frontend-bundle.zip www/
          echo "ZIP bundle created successfully for version ${{ steps.version.outputs.tag }}"

      - name: Upload OTA Bundle to Laravel Server
        env:
          LARAVEL_TOKEN: ${{ secrets.LARAVEL_UPLOAD_TOKEN }}
        run: |
          # Kirim file zip ke endpoint API Laravel lo otomatis
          curl -X POST \
            -F "file=@frontend-bundle.zip" \
            -F "version=${{ steps.version.outputs.tag }}" \
            -H "Authorization: Bearer $LARAVEL_TOKEN" \
            https://pc-remote.pramaxx.biz.id/api/android/upload-bundle

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Add Capacitor Android Platform
        run: |
          npx cap sync android

      - name: Generate App Icon Automatically
        run: |
          npx capacitor-assets generate --iconBackgroundColor "#0f172a" || echo "Icon generation skipped, using default"
          npx cap sync android

      - name: Update Android Version
        run: |
          RUN_NUM=${{ github.run_number }}
          # Ubah versionCode dan versionName di android/app/build.gradle secara otomatis
          sed -i "s/versionCode [0-9]*/versionCode $RUN_NUM/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.$RUN_NUM\"/g" android/app/build.gradle
          echo "Updated Android app version to 1.0.$RUN_NUM (Code: $RUN_NUM)"

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Pramaxx Remote ${{ steps.version.outputs.tag }}"
          body: |
            ### 🚀 Update Otomatis Pramaxx Remote (${{ steps.version.outputs.tag }})
            - **APK Android**: Auto-generated dari GitHub Actions (untuk instalasi awal).
            - **OTA Bundle (`frontend-bundle.zip`)**: Berhasil dikirim otomatis ke server Laravel untuk update via aplikasi.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            frontend-bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
