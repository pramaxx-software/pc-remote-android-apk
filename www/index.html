<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pramaxx Remote Keyboard</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* --- CARD & CONTAINERS --- */
        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffa806;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            background-color: var(--bg-input);
            color: var(--text-sub);
        }

        .status-badge.connected { background-color: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .status-badge.disconnected { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }

        /* --- FORM INPUTS & RESPONSIVE GRID --- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
        }

        /* Otomatis jadi 1 kolom ke bawah ketika dibuka di HP / layar kecil */
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        label { font-size: 11px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; }

        input, select {
            background-color: var(--bg-input);
            border: 1px solid #475569;
            border-radius: 10px;
            padding: 10px 12px;
            color: white;
            font-size: 14px;
            outline: none;
            user-select: text;
        }

        input:focus, select:focus { border-color: var(--accent); }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active { transform: scale(0.97); }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }
        .btn-secondary { background-color: #475569; }

        /* --- MACRO PAD GRID (STREAM DECK STYLE) --- */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .macro-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .macro-btn {
            aspect-ratio: 1 / 0.85;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            transition: all 0.08s;
            touch-action: manipulation; /* Mencegah delay tap di mobile */
        }

        .macro-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }

        .macro-label { font-size: 13px; font-weight: 700; color: white; margin-bottom: 4px; pointer-events: none; }
        .macro-sub { font-size: 10px; color: rgba(255,255,255,0.7); font-family: monospace; pointer-events: none; }

        .del-badge {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 10px;
            background: rgba(0,0,0,0.5);
            color: #fca5a5;
            padding: 2px 6px;
            border-radius: 10px;
            display: none;
        }

        .edit-mode .del-badge { display: block; }
        .edit-mode .macro-btn { animation: shake 0.3s infinite alternate; }

        @keyframes shake {
            from { transform: rotate(-1deg); }
            to { transform: rotate(1deg); }
        }

        /* --- COLOR THEMES FOR MACRO BUTTONS --- */
        .theme-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .theme-red { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .theme-green { background: linear-gradient(135deg, #059669, #047857); }
        .theme-purple { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
        .theme-yellow { background: linear-gradient(135deg, #d97706, #b45309); }
        .theme-dark { background: linear-gradient(135deg, #334155, #1e293b); }

        /* --- MODAL TAMBAH TOMBOL --- */
        #addModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 99;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #475569;
        }
    </style>
</head>
<body>

    <!-- 1. HEADER & STATUS -->
    <div class="card header">
        <div class="title">Pramaxx Remote Keyboard</div>
        <div id="statusBadge" class="status-badge disconnected">Disconnected</div>
    </div>

    <!-- 2. KONEKSI & PIN (OPSIONAL) -->
    <div class="card">
        <div class="form-row">
            <div class="form-group">
                <label>IP LAN / Domain:</label>
                <input type="text" id="ipInput" placeholder="192.168.1.15 / web.domain.com">
            </div>
            <div class="form-group">
                <label>Port:</label>
                <input type="number" id="portInput" placeholder="8765" value="8765">
            </div>
        </div>
        <div class="form-group">
            <label>PIN Keamanan PC <span style="text-transform:none; color:#10b981;">(Opsional jika LAN)</span>:</label>
            <input type="password" id="pinInput" placeholder="Kosongkan jika tidak ada PIN..." maxlength="6">
        </div>
        <button id="connectBtn" class="btn" onclick="toggleConnection()">Hubungkan ke PC</button>
    </div>

    <!-- 3. CUSTOM MACRO PAD (TRIGGER TOMBOL) -->
    <div class="card" id="controlPanel" style="opacity: 0.5; pointer-events: none;">
        <div class="section-header">
            <div class="section-title">Trigger Pad (Hold-to-Repeat)</div>
            <div style="display: flex; gap: 6px;">
                <button class="btn btn-secondary" style="padding: 6px 10px; font-size: 12px; width: auto;" onclick="toggleEditMode()">Hapus</button>
                <button class="btn btn-success" style="padding: 6px 10px; font-size: 12px; width: auto;" onclick="openAddModal()">Tambah</button>
            </div>
        </div>

        <!-- Wadah Grid Tombol Custom -->
        <div class="macro-grid" id="macroGrid">
            <!-- Tombol akan dirender dari JS -->
        </div>
    </div>

    <!-- 4. MODAL TAMBAH TOMBOL CUSTOM -->
    <div id="addModal" style="display: none;">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; font-size: 16px;">Buat Tombol Macro Baru</h3>
            
            <div class="form-group">
                <label>Nama Tombol / Label:</label>
                <input type="text" id="mLabel" placeholder="Misal: Mute Mic, Next Slide, ULTI...">
            </div>

            <div class="form-group">
                <label>Tipe Trigger:</label>
                <select id="mType">
                    <option value="press">Single Key (Satu Tombol: space, f1, a, esc)</option>
                    <option value="shortcut">Shortcut / Kombinasi (ctrl+c, alt+tab, win+d)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tombol Keyboard / Shortcut:</label>
                <input type="text" id="mKey" placeholder="Misal: f5, atau ctrl+shift+m">
                <small style="color: var(--text-sub); font-size: 11px; margin-top: 2px;">
                    *Gunakan tanda plus (+) untuk kombinasi shortcut. Contoh: <b>ctrl+alt+del</b> atau <b>win+d</b>.
                </small>
            </div>

            <div class="form-group">
                <label>Warna Tombol:</label>
                <select id="mColor">
                    <option value="theme-blue">Biru (Default)</option>
                    <option value="theme-red">Merah (Action/Danger)</option>
                    <option value="theme-green">Hijau (Media/Play)</option>
                    <option value="theme-purple">Ungu (Special/Macro)</option>
                    <option value="theme-yellow">Kuning (Warning)</option>
                    <option value="theme-dark">Gelap (Neutral/System)</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-secondary" onclick="closeAddModal()">Batal</button>
                <button class="btn btn-success" onclick="saveNewButton()">Simpan Tombol</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let isConnected = false;
        let isEditMode = false;
        let holdInterval = null; // Menyimpan status interval tombol ditahan

        const DEFAULT_BUTTONS = [
            { label: "Play / Pause", type: "press", key: "space", color: "theme-green" },
            { label: "Next Slide", type: "press", key: "right", color: "theme-blue" },
            { label: "Prev Slide", type: "press", key: "left", color: "theme-blue" },
            { label: "Copy", type: "shortcut", key: "ctrl+c", color: "theme-yellow" },
            { label: "Paste", type: "shortcut", key: "ctrl+v", color: "theme-yellow" },
            { label: "Mute Audio", type: "press", key: "f1", color: "theme-red" },
        ];

        let macroButtons = [];

        window.onload = () => {
            if (localStorage.getItem("rem_ip")) document.getElementById("ipInput").value = localStorage.getItem("rem_ip");
            if (localStorage.getItem("rem_port")) document.getElementById("portInput").value = localStorage.getItem("rem_port");
            if (localStorage.getItem("rem_pin")) document.getElementById("pinInput").value = localStorage.getItem("rem_pin");
            
            loadMacroButtons();
            renderButtons();
        };

        function toggleConnection() {
            if (isConnected) {
                ws.close();
                return;
            }

            const ip = document.getElementById("ipInput").value.trim();
            const port = document.getElementById("portInput").value.trim();
            const pin = document.getElementById("pinInput").value.trim();

            if (!ip) {
                alert("Masukkan IP LAN atau Domain Cloudflare dulu, bre!");
                return;
            }

            localStorage.setItem("rem_ip", ip);
            localStorage.setItem("rem_port", port);
            localStorage.setItem("rem_pin", pin);

            const badge = document.getElementById("statusBadge");
            const btn = document.getElementById("connectBtn");
            
            badge.innerText = "● Connecting...";
            badge.className = "status-badge";
            badge.style.color = "#f59e0b";

            let wsUrl = ip.match(/[a-zA-Z]/) 
                ? `wss://${ip.replace(/^(https?|wss?):\/\//, '')}` 
                : `ws://${ip}:${port}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                isConnected = true;
                badge.innerText = "Connected";
                badge.className = "status-badge connected";
                badge.style.color = "";
                
                btn.innerText = "Putuskan Koneksi";
                btn.className = "btn btn-danger";

                document.getElementById("controlPanel").style.opacity = "1";
                document.getElementById("controlPanel").style.pointerEvents = "auto";
            };

            ws.onclose = resetUI;
            ws.onerror = (e) => {
                alert("Gagal terhubung ke PC! Pastikan IP/Domain benar dan program desktop sudah berjalan.");
                resetUI();
            };
        }

        function resetUI() {
            isConnected = false;
            stopHold(); // Hentikan holding jika koneksi terputus
            const badge = document.getElementById("statusBadge");
            const btn = document.getElementById("connectBtn");

            badge.innerText = "Disconnected";
            badge.className = "status-badge disconnected";
            badge.style.color = "";
            
            btn.innerText = "Hubungkan ke PC";
            btn.className = "btn";

            document.getElementById("controlPanel").style.opacity = "0.5";
            document.getElementById("controlPanel").style.pointerEvents = "none";
            isEditMode = false;
            document.getElementById("macroGrid").classList.remove("edit-mode");
        }

        // --- LOGIKA HOLD-TO-REPEAT (DITAHAN / PUSH TERUS MENERUS) ---
        function startHold(index, event) {
            if (event) event.preventDefault(); // Hindari efek klik ganda/zoom di mobile

            if (isEditMode) {
                if (confirm(`Hapus tombol "${macroButtons[index].label}"?`)) {
                    macroButtons.splice(index, 1);
                    saveMacroButtons();
                    renderButtons();
                }
                return;
            }

            if (!isConnected || !ws) return;

            // Eksekusi sekali langsung saat pertama ditekan
            executeMacro(index);

            // Jika tombol terus ditahan, kirim perintah berulang setiap 120ms
            if (holdInterval) clearInterval(holdInterval);
            holdInterval = setInterval(() => {
                executeMacro(index);
            }, 120);
        }

        function stopHold() {
            if (holdInterval) {
                clearInterval(holdInterval);
                holdInterval = null;
            }
        }

        function executeMacro(index) {
            if (!isConnected || !ws) return;

            const btn = macroButtons[index];
            const pinVal = document.getElementById("pinInput").value.trim() || "";
            let payload = { pin: pinVal };

            if (btn.type === "shortcut") {
                payload.type = "shortcut";
                payload.keys = btn.key.toLowerCase().split("+").map(k => k.trim());
            } else {
                payload.type = "press";
                payload.key = btn.key.toLowerCase().trim();
            }

            ws.send(JSON.stringify(payload));
            if (navigator.vibrate) navigator.vibrate(20); // Getar tipis per trigger
        }

        // --- RENDER & MANAGEMENT TOMBOL ---
        function loadMacroButtons() {
            const saved = localStorage.getItem("rem_macro_pad");
            if (saved) {
                try { macroButtons = JSON.parse(saved); } 
                catch { macroButtons = [...DEFAULT_BUTTONS]; }
            } else {
                macroButtons = [...DEFAULT_BUTTONS];
            }
        }

        function saveMacroButtons() {
            localStorage.setItem("rem_macro_pad", JSON.stringify(macroButtons));
        }

        function renderButtons() {
            const grid = document.getElementById("macroGrid");
            grid.innerHTML = "";

            macroButtons.forEach((btn, idx) => {
                const el = document.createElement("div");
                el.className = `macro-btn ${btn.color}`;

                // Binding event Touch & Mouse untuk fitur Hold-to-Repeat
                el.onmousedown = (e) => startHold(idx, e);
                el.onmouseup = stopHold;
                el.onmouseleave = stopHold;
                
                el.ontouchstart = (e) => startHold(idx, e);
                el.ontouchend = stopHold;
                el.ontouchcancel = stopHold;

                el.innerHTML = `
                    <span class="del-badge">Hapus</span>
                    <div class="macro-label">${btn.label}</div>
                    <div class="macro-sub">${btn.key.toUpperCase()}</div>
                `;
                grid.appendChild(el);
            });
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const grid = document.getElementById("macroGrid");
            if (isEditMode) {
                grid.classList.add("edit-mode");
                alert("Mode Hapus Aktif: Klik pada tombol yang ingin dihapus.");
            } else {
                grid.classList.remove("edit-mode");
            }
        }

        function openAddModal() {
            document.getElementById("addModal").style.display = "flex";
        }

        function closeAddModal() {
            document.getElementById("addModal").style.display = "none";
            document.getElementById("mLabel").value = "";
            document.getElementById("mKey").value = "";
        }

        function saveNewButton() {
            const label = document.getElementById("mLabel").value.trim();
            const type = document.getElementById("mType").value;
            const key = document.getElementById("mKey").value.trim();
            const color = document.getElementById("mColor").value;

            if (!label || !key) {
                alert("Nama label dan tombol keyboard wajib diisi!");
                return;
            }

            macroButtons.push({ label, type, key, color });
            saveMacroButtons();
            renderButtons();
            closeAddModal();
        }
    </script>
</body>
</html>
