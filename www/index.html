<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pramaxx Remote Keyboard</title>
    <script src="htmlqrcode.min.js"></script>
    <script src="sweetalert2.js"></script>
    <link rel="stylesheet" href="sweetalert2.css" />
    <link rel="stylesheet" href="new-style.css" />
  </head>
  <body>
    <!-- PULL TO REFRESH INDIKATOR -->
    <div id="ptrIndicator">
      <span id="ptrText">Tarik ke bawah untuk memperbarui...</span>
    </div>

    <!-- 1. HEADER & STATUS -->
    <div class="card header" id="mainHeaderCard">
      <div class="title">Pramaxx Remote Keyboard</div>
      <div id="statusBadge" class="status-badge disconnected">Disconnected</div>
    </div>

    <!-- 2. KONEKSI & PIN -->
    <div class="card" id="connectionCard">
      <div class="form-row">
        <div class="form-group">
          <label>IP LAN / Domain:</label>
          <input
            type="text"
            id="ipInput"
            placeholder="192.168.1.15 / web.domain.com"
          />
        </div>
        <div class="form-group">
          <label>Port:</label>
          <input type="number" id="portInput" placeholder="8765" value="8765" />
        </div>
      </div>
      <div class="form-group">
        <label
          >PIN Keamanan PC
          <span style="text-transform: none; color: #10b981"
            >(Opsional jika LAN)</span
          >:</label
        >
        <input
          type="password"
          id="pinInput"
          placeholder="Kosongkan jika tidak ada PIN..."
          maxlength="6"
        />
      </div>

      <div class="action-row">
        <button
          id="connectBtn"
          class="btn"
          onclick="toggleConnection()"
          style="flex: 2"
        >
          Hubungkan PC
        </button>
        <button
          id="scanBtn"
          class="btn btn-secondary"
          onclick="openQrScanner()"
          style="flex: 1"
        >
          Scan QR
        </button>
      </div>
    </div>

    <!-- TAB BAR (HANYA 2 MENU UTAMA: MACRO & STREAM) -->
    <div class="tab-bar" id="tabBar">
      <button
        class="tab-btn active"
        data-tab="macro"
        onclick="switchTab('macro')"
      >
        ⌨ Macro Pad
      </button>
      <button class="tab-btn" data-tab="stream" onclick="switchTab('stream')">
        🖥 Stream & Control
      </button>
    </div>

    <!-- 3. CUSTOM MACRO PAD -->
    <div class="card tab-panel" id="panel-macro">
      <div class="section-header">
        <div class="section-title">Trigger Pad (Hold-to-Repeat)</div>
        <div style="display: flex; gap: 6px">
          <button
            id="editModeBtn"
            class="btn btn-secondary"
            style="padding: 6px 10px; font-size: 12px; width: auto"
            onclick="toggleEditMode()"
          >
            Edit
          </button>
          <button
            class="btn btn-success"
            style="padding: 6px 10px; font-size: 12px; width: auto"
            onclick="openAddModal()"
          >
            Tambah
          </button>
        </div>
      </div>
      <div class="macro-grid" id="macroGrid"></div>
    </div>

    <!-- 3B. STREAM TAB (OTOMATIS FULLSCREEN, LANDSCAPE & FLOATING PROPERTIES) -->
    <div class="stream-wrapper" id="panel-stream">
      <div class="screen-container" id="streamTouchArea">
        <img id="screenImage" alt="Live screen" />
        <span id="screenPlaceholder">Menghubungkan & Memuat Stream...</span>
        <!-- Kursor Client -->
        <div id="clientCursor"></div>
      </div>

      <!-- Floating Button untuk Toggle Properties Control (Mouse & Keyboard) -->
      <button id="floatingPropBtn" onclick="togglePropertiesPanel()">⚙️</button>

      <!-- Panel Properties (Kontrol Mouse & Keyboard Tersembunyi di Floating Menu) -->
      <div
        id="propertiesPanel"
        style="max-height: 200px; overflow-y: auto; padding-right: 1.2rem"
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <span class="prop-section-title" style="margin: 0"
            >Stream & Mouse Control</span
          >
          <button
            onclick="togglePropertiesPanel()"
            style="
              background: none;
              border: none;
              color: white;
              font-size: 16px;
              cursor: pointer;
            "
          >
            ✕
          </button>
        </div>

        <!-- AREA TRACKPAD DI DALAM FLOATING PANEL -->
        <div>
          <div class="prop-section-title">
            Trackpad (Geser untuk Gerusin Kursor)
          </div>
          <div
            id="floatingTrackpad"
            style="
              width: 100%;
              height: 110px;
              background-color: var(--bg-input);
              border: 1px dashed #475569;
              border-radius: 10px;
              display: flex;
              align-items: center;
              justify-content: center;
              color: var(--text-sub);
              font-size: 12px;
              touch-action: none;
            "
          >
            Usap di sini untuk gerakin mouse
          </div>
        </div>

        <div>
          <div class="prop-section-title">Klik Mouse</div>
          <div class="mouse-btn-row">
            <button
              class="btn"
              style="background: var(--bg-input)"
              onclick="sendMouseClick('left')"
            >
              Klik Kiri
            </button>
            <button class="btn btn-secondary" onclick="sendMouseClick('right')">
              Klik Kanan
            </button>
            <button
              class="btn btn-secondary"
              onclick="sendMouseClick('left', true)"
            >
              Double
            </button>
          </div>
        </div>

        <div>
          <div class="prop-section-title">Scroll</div>
          <div class="scroll-btn-row">
            <button class="btn btn-secondary" onclick="sendMouseScroll(1)">
              ▲ Atas
            </button>
            <button class="btn btn-secondary" onclick="sendMouseScroll(-1)">
              ▼ Bawah
            </button>
          </div>
        </div>

        <div>
          <label style="font-size: 10px"
            >Sensitivitas: <span id="sensValue">1.5x</span></label
          >
          <input
            type="range"
            id="sensSlider"
            min="0.5"
            max="3"
            step="0.1"
            value="1.5"
            oninput="onSensitivityChange(this.value)"
          />
        </div>

        <div>
          <button
            class="btn btn-danger"
            style="padding: 8px; font-size: 12px"
            onclick="exitStreamTab()"
          >
            Keluar Stream Mode
          </button>
        </div>
      </div>
    </div>

    <!-- 4. MODAL TAMBAH / EDIT TOMBOL -->
    <div id="macroModal" class="modal-overlay">
      <div class="modal-content">
        <h3 id="modalTitle" style="margin-bottom: 15px; font-size: 16px">
          Buat Tombol Macro Baru
        </h3>
        <input type="hidden" id="editIndex" value="-1" />
        <div class="form-group">
          <label>Nama Tombol / Label:</label>
          <input
            type="text"
            id="mLabel"
            placeholder="Misal: Mute Mic, Next Slide..."
          />
        </div>
        <div class="form-group">
          <label>Tipe Trigger:</label>
          <select id="mType">
            <option value="press">Single Key (Satu Tombol)</option>
            <option value="shortcut">Shortcut (Kombinasi)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tombol Keyboard / Shortcut:</label>
          <input
            type="text"
            id="mKey"
            placeholder="Misal: f5, atau ctrl+shift+m"
          />
        </div>
        <div class="form-group">
          <label>Warna Tombol:</label>
          <select id="mColor">
            <option value="theme-blue">Biru (Default)</option>
            <option value="theme-red">Merah (Action/Danger)</option>
            <option value="theme-green">Hijau (Media/Play)</option>
            <option value="theme-purple">Ungu (Special/Macro)</option>
            <option value="theme-yellow">Kuning (Warning)</option>
            <option value="theme-dark">Gelap (Neutral/System)</option>
          </select>
        </div>
        <div
          style="display: flex; gap: 10px; margin-top: 15px"
          id="modalActionButtons"
        >
          <button class="btn btn-secondary" onclick="closeMacroModal()">
            Batal
          </button>
          <button class="btn btn-success" onclick="saveMacroButton()">
            Simpan
          </button>
        </div>
      </div>
    </div>

    <!-- 5. MODAL QR SCANNER -->
    <div id="qrModal" class="modal-overlay">
      <div class="modal-content" style="background: var(--bg-main)">
        <h3
          style="
            margin-bottom: 15px;
            font-size: 16px;
            text-align: center;
            color: white;
          "
        >
          Arahkan Kamera ke QR Code
        </h3>
        <div id="qrReader"></div>
        <button class="btn btn-danger" onclick="closeQrScanner()">
          Tutup Kamera
        </button>
      </div>
    </div>

    <script src="new-main.js"></script>
  </body>
</html>
