<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pramaxx Remote Keyboard</title>
    <!-- TAMBAHAN: Library Scanner QR Code -->
    <script src="htmlqrcode.min.js"></script>
    <script src="sweetalert2.js"></script>
    <link rel="stylesheet" href="sweetalert2.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- PULL TO REFRESH INDIKATOR -->
    <div id="ptrIndicator">
      <span id="ptrText">Tarik ke bawah untuk memperbarui...</span>
    </div>

    <!-- 1. HEADER & STATUS -->
    <div class="card header">
      <div class="title">Pramaxx Remote Keyboard</div>
      <div id="statusBadge" class="status-badge disconnected">Disconnected</div>
    </div>

    <!-- 2. KONEKSI & PIN (DENGAN FITUR QR) - AKAN DISSEMBUNYIKAN SAAT TERHUBUNG -->
    <div class="card" id="connectionCard">
      <div class="form-row">
        <div class="form-group">
          <label>IP LAN / Domain:</label>
          <input
            type="text"
            id="ipInput"
            placeholder="192.168.1.15 / web.domain.com"
          />
        </div>
        <div class="form-group">
          <label>Port:</label>
          <input type="number" id="portInput" placeholder="8765" value="8765" />
        </div>
      </div>
      <div class="form-group">
        <label
          >PIN Keamanan PC
          <span style="text-transform: none; color: #10b981"
            >(Opsional jika LAN)</span
          >:</label
        >
        <input
          type="password"
          id="pinInput"
          placeholder="Kosongkan jika tidak ada PIN..."
          maxlength="6"
        />
      </div>

      <!-- Action Row (Connect & Scan QR) -->
      <div class="action-row">
        <button
          id="connectBtn"
          class="btn"
          onclick="toggleConnection()"
          style="flex: 2"
        >
          Hubungkan PC
        </button>
        <button
          id="scanBtn"
          class="btn btn-secondary"
          onclick="openQrScanner()"
          style="flex: 1"
        >
          Scan QR
        </button>
      </div>
    </div>

    <!-- TAB BAR (MUNCUL SAAT SUDAH TERHUBUNG) -->
    <div class="tab-bar" id="tabBar">
      <button
        class="tab-btn active"
        data-tab="macro"
        onclick="switchTab('macro')"
      >
        ⌨ Macro Pad
      </button>
      <button class="tab-btn" data-tab="stream" onclick="switchTab('stream')">
        🖥 Stream
      </button>
    </div>

    <!-- 3. CUSTOM MACRO PAD -->
    <div class="card tab-panel" id="panel-macro">
      <div class="section-header">
        <div class="section-title">Trigger Pad (Hold-to-Repeat)</div>
        <div style="display: flex; gap: 6px">
          <button
            id="editModeBtn"
            class="btn btn-secondary"
            style="padding: 6px 10px; font-size: 12px; width: auto"
            onclick="toggleEditMode()"
          >
            Edit
          </button>
          <button
            class="btn btn-success"
            style="padding: 6px 10px; font-size: 12px; width: auto"
            onclick="openAddModal()"
          >
            Tambah
          </button>
        </div>
      </div>
      <div class="macro-grid" id="macroGrid"></div>
    </div>

    <!-- 3B. STREAM (FULLSCREEN + LANDSCAPE + FLOATING CONTROL) -->
    <div class="tab-panel" id="panel-stream" style="display: none">
      <div class="stream-stage" id="streamStage">
        <img id="screenImage" alt="Live screen" />
        <span id="screenPlaceholder">Menyambungkan ke layar PC...</span>

        <div id="streamStatus" class="stream-status-pill">Nonaktif</div>

        <button
          class="exit-stream-btn"
          id="exitStreamBtn"
          onclick="switchTab('macro')"
          title="Keluar dari Stream"
        >
          ✕
        </button>

        <!-- ZOOM TOOLBAR (PINCH / DOUBLE TAP / TOMBOL) -->
        <div class="zoom-toolbar" id="zoomToolbar">
          <button onclick="zoomStreamBy(0.5)" title="Perbesar">＋</button>
          <span id="zoomLabel">100%</span>
          <button onclick="zoomStreamBy(-0.5)" title="Perkecil">－</button>
          <button onclick="resetStreamZoom()" title="Reset Zoom">⤢</button>
        </div>

        <!-- FLOATING TOGGLE BUTTON -->
        <button
          id="fabToggle"
          class="fab-btn"
          onclick="toggleControlDrawer()"
          title="Kontrol Mouse & Keyboard"
        >
          🎮
        </button>

        <!-- SLIDE-IN CONTROL DRAWER -->
        <div id="controlDrawer" class="control-drawer">
          <div class="drawer-header">
            <div class="drawer-tabs">
              <button
                class="drawer-tab-btn active"
                data-ctrl="mouse"
                onclick="switchControlTab('mouse')"
              >
                🖱 Mouse
              </button>
              <button
                class="drawer-tab-btn"
                data-ctrl="keyboard"
                onclick="switchControlTab('keyboard')"
              >
                ⌨ Keyboard
              </button>
            </div>
            <button class="drawer-close" onclick="toggleControlDrawer()">
              ✕
            </button>
          </div>

          <div class="drawer-body">
            <!-- MOUSE CONTROL -->
            <div class="ctrl-panel" id="ctrl-mouse">
              <div id="trackpadArea">
                <span id="trackpadHint"
                  >Geser untuk gerakkan kursor · Tap = klik kiri</span
                >
              </div>
              <div class="mouse-btn-row">
                <button
                  class="btn"
                  style="background: var(--bg-input)"
                  onclick="sendMouseClick('left')"
                >
                  Klik Kiri
                </button>
                <button
                  class="btn btn-secondary"
                  onclick="sendMouseClick('right')"
                >
                  Klik Kanan
                </button>
                <button
                  class="btn btn-secondary"
                  onclick="sendMouseClick('left', true)"
                >
                  Double
                </button>
              </div>
              <div class="scroll-btn-row">
                <button class="btn btn-secondary" onclick="sendMouseScroll(1)">
                  ▲ Scroll
                </button>
                <button class="btn btn-secondary" onclick="sendMouseScroll(-1)">
                  ▼ Scroll
                </button>
              </div>
              <div class="form-group" style="margin-top: 10px">
                <label>Sensitivitas: <span id="sensValue">1.5x</span></label>
                <input
                  type="range"
                  id="sensSlider"
                  min="0.5"
                  max="3"
                  step="0.1"
                  value="1.5"
                  oninput="onSensitivityChange(this.value)"
                />
              </div>
            </div>

            <!-- KEYBOARD CONTROL -->
            <div class="ctrl-panel" id="ctrl-keyboard" style="display: none">
              <input
                type="text"
                id="typeInput"
                class="type-input"
                placeholder="Ketuk lalu ketik di sini..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
              />
              <div class="key-grid">
                <button
                  class="btn btn-secondary"
                  onclick="sendKeyPress('enter')"
                >
                  Enter
                </button>
                <button
                  class="btn btn-secondary"
                  onclick="sendKeyPress('backspace')"
                >
                  ⌫
                </button>
                <button class="btn btn-secondary" onclick="sendKeyPress('esc')">
                  Esc
                </button>
                <button class="btn btn-secondary" onclick="sendKeyPress('tab')">
                  Tab
                </button>
                <button class="btn btn-secondary" onclick="sendKeyPress('up')">
                  ▲
                </button>
                <button
                  class="btn btn-secondary"
                  onclick="sendKeyPress('down')"
                >
                  ▼
                </button>
                <button
                  class="btn btn-secondary"
                  onclick="sendKeyPress('left')"
                >
                  ◀
                </button>
                <button
                  class="btn btn-secondary"
                  onclick="sendKeyPress('right')"
                >
                  ▶
                </button>
              </div>
              <div class="form-group" style="margin-top: 10px">
                <label>Shortcut Custom (pisahkan koma):</label>
                <div style="display: flex; gap: 6px">
                  <input
                    type="text"
                    id="drawerShortcutInput"
                    placeholder="ctrl,alt,t"
                  />
                  <button
                    class="btn"
                    style="width: auto; padding: 10px 14px"
                    onclick="sendDrawerShortcut()"
                  >
                    Kirim
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. MODAL TAMBAH / EDIT TOMBOL -->
    <div id="macroModal" class="modal-overlay">
      <div class="modal-content">
        <h3 id="modalTitle" style="margin-bottom: 15px; font-size: 16px">
          Buat Tombol Macro Baru
        </h3>
        <input type="hidden" id="editIndex" value="-1" />
        <div class="form-group">
          <label>Nama Tombol / Label:</label>
          <input
            type="text"
            id="mLabel"
            placeholder="Misal: Mute Mic, Next Slide..."
          />
        </div>
        <div class="form-group">
          <label>Tipe Trigger:</label>
          <select id="mType">
            <option value="press">Single Key (Satu Tombol)</option>
            <option value="shortcut">Shortcut (Kombinasi)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tombol Keyboard / Shortcut:</label>
          <input
            type="text"
            id="mKey"
            placeholder="Misal: f5, atau ctrl+shift+m"
          />
        </div>
        <div class="form-group">
          <label>Warna Tombol:</label>
          <select id="mColor">
            <option value="theme-blue">Biru (Default)</option>
            <option value="theme-red">Merah (Action/Danger)</option>
            <option value="theme-green">Hijau (Media/Play)</option>
            <option value="theme-purple">Ungu (Special/Macro)</option>
            <option value="theme-yellow">Kuning (Warning)</option>
            <option value="theme-dark">Gelap (Neutral/System)</option>
          </select>
        </div>
        <div
          style="display: flex; gap: 10px; margin-top: 15px"
          id="modalActionButtons"
        >
          <button class="btn btn-secondary" onclick="closeMacroModal()">
            Batal
          </button>
          <button class="btn btn-success" onclick="saveMacroButton()">
            Simpan
          </button>
        </div>
      </div>
    </div>

    <!-- 5. MODAL QR SCANNER -->
    <div id="qrModal" class="modal-overlay">
      <div class="modal-content" style="background: var(--bg-main)">
        <h3
          style="
            margin-bottom: 15px;
            font-size: 16px;
            text-align: center;
            color: white;
          "
        >
          Arahkan Kamera ke QR Code
        </h3>

        <!-- Area Kamera -->
        <div id="qrReader"></div>

        <button class="btn btn-danger" onclick="closeQrScanner()">
          Tutup Kamera
        </button>
      </div>
    </div>

    <!-- FLOATING DEBUG CONSOLE -->
    <!-- <button id="toggleDebugBtn" onclick="toggleDebugConsole()">🐛 Log</button> -->
    <div id="debugConsole">
      <div class="debug-header">
        <span>Console Debugger</span>
        <div style="display: flex; gap: 5px">
          <button
            onclick="clearDebugLogs()"
            style="
              background: #ef4444;
              border: none;
              color: white;
              padding: 2px 6px;
              border-radius: 4px;
              font-size: 10px;
            "
          >
            Clear
          </button>
          <button
            onclick="toggleDebugConsole()"
            style="
              background: #475569;
              border: none;
              color: white;
              padding: 2px 6px;
              border-radius: 4px;
              font-size: 10px;
            "
          >
            X
          </button>
        </div>
      </div>
      <div class="debug-body" id="debugLogBody"></div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
